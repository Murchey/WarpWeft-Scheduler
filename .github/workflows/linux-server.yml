name: Linux server

on:
  push:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'server/**'
      - 'linux_server/**'
      - 'services/solver-java/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'guideline.md'
      - '.github/workflows/linux-server.yml'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build renderer and solver
        run: npm run build
      - name: Package Linux server
        run: npm run dist:linux -- --skip-build
      - name: Inspect package
        run: |
          set -euo pipefail
          tar -tzf dist/linux-server/warpweft-linux-server-*.tar.gz >/tmp/warpweft-tar.list
          grep -q 'warpweft/linux_server/server.cjs' /tmp/warpweft-tar.list
          grep -q 'warpweft/linux_server/warpweft.service' /tmp/warpweft-tar.list
          grep -q 'warpweft/dist/index.html' /tmp/warpweft-tar.list
          grep -q 'warpweft/resources/solver/warpweft-solver.jar' /tmp/warpweft-tar.list
          grep -q 'warpweft/guideline.md' /tmp/warpweft-tar.list
          cd dist/linux-server
          sha256sum -c warpweft-linux-server-*.tar.gz.sha256
      - name: Smoke-test package
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          pid=""
          trap 'if [ -n "$pid" ]; then kill "$pid" 2>/dev/null || true; fi; rm -rf "$tmp"' EXIT
          tar -xzf dist/linux-server/warpweft-linux-server-*.tar.gz -C "$tmp"
          WARPVEFT_DATA_DIR="$tmp/data" WARPVEFT_HOST=127.0.0.1 WARPVEFT_PORT=4399 \
            node "$tmp/warpweft/linux_server/server.cjs" >"$tmp/server.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:4399/api/health >/tmp/warpweft-health.json 2>/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4399/api/health | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:4399/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:4399/api/data | grep -q '"school"'
          kill -TERM "$pid"
          wait "$pid" || true
          cat "$tmp/server.log"
