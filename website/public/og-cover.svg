<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="WarpWeft Scheduler 经纬排课">
  <rect width="1200" height="630" fill="#171817" />
  <!-- 课表网格底纹 -->
  <g stroke="#3a3a37" stroke-width="1">
    <line x1="120" y1="180" x2="1080" y2="180" />
    <line x1="120" y1="270" x2="1080" y2="270" />
    <line x1="120" y1="360" x2="1080" y2="360" />
    <line x1="120" y1="450" x2="1080" y2="450" />
    <line x1="360" y1="180" x2="360" y2="450" />
    <line x1="600" y1="180" x2="600" y2="450" />
    <line x1="840" y1="180" x2="840" y2="450" />
  </g>
  <!-- 强调块（信号色） -->
  <rect x="120" y="270" width="240" height="90" fill="#ffcc00" />
  <rect x="600" y="180" width="240" height="90" fill="#ffcc00" opacity="0.85" />
  <rect x="360" y="360" width="240" height="90" fill="#ffcc00" opacity="0.55" />
  <rect x="840" y="360" width="240" height="90" fill="#ffcc00" opacity="0.35" />
  <!-- 品牌标记 -->
  <g transform="translate(120, 96)">
    <rect width="52" height="52" rx="11" fill="#ffcc00" />
    <g stroke="#171817" stroke-width="3">
      <line x1="12" y1="18" x2="40" y2="18" />
      <line x1="12" y1="26" x2="40" y2="26" />
      <line x1="12" y1="34" x2="28" y2="34" />
      <line x1="16" y1="12" x2="16" y2="40" />
      <line x1="28" y1="12" x2="28" y2="40" />
    </g>
  </g>
  <text x="192" y="133" fill="#f5f5f7" font-family="Saira, 'Arial Narrow', Helvetica, sans-serif" font-size="34" font-weight="800" letter-spacing="6">WARPWEFT</text>
  <text x="120" y="520" fill="#f5f5f7" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, sans-serif" font-size="46" font-weight="700">经纬排课</text>
  <text x="120" y="566" fill="#a1a1a6" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, sans-serif" font-size="22">单机与局域网小规模排课 · 支持 Linux 服务端自部署</text>
</svg>
